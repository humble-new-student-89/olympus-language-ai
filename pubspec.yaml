name: olympus_language_ai
description: "Voice-first language learning app — speak with an AI partner."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.2

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Audio / Voice
  record: ^5.2.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.5

  # Networking
  http: ^1.2.2

  # Env
  flutter_dotenv: ^5.2.1

  # Billing
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.4.0

  # Push notifications
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # Sharing
  share_plus: ^10.1.4

  # Charts
  fl_chart: ^0.70.2

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  mockito: ^5.4.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env
